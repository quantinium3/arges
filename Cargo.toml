[package]
name = "arges"
version = "0.1.6"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["migrate", "runtime-tokio", "sqlite"] }
sysinfo = { version = "0.38.4", default-features = false, features = ["system", "disk"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "trace"] }
tracing = "0.1.44"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
which = "7.0"
