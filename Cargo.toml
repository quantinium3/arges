[package]
name = "arges"
version = "0.3.1"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
axum = "0.8.9"
bollard = "0.21.1"
futures-util = "0.3"
getrandom = "0.4.3"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", features = ["migrate", "runtime-tokio", "sqlite"] }
sysinfo = { version = "0.38.4", default-features = false, features = ["system", "disk"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "trace"] }
tracing = "0.1.44"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
which = "7.0"
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
